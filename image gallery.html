<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Image Gallery</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(45deg,#0f2027,#203a43,#2c5364);
background-size:400% 400%;
animation:bgmove 12s infinite alternate;
color:white;
}

@keyframes bgmove{
0%{background-position:left;}
100%{background-position:right;}
}

header{
text-align:center;
padding:30px;
font-size:40px;
font-weight:bold;
letter-spacing:3px;
}

.theme-btn{
position:fixed;
top:20px;
right:20px;
padding:10px 18px;
border:none;
border-radius:20px;
background:white;
cursor:pointer;
font-weight:bold;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.card{
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.5);
transition:0.4s;
}

.card:hover{
transform:scale(1.08);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
cursor:pointer;
}

.card:hover img{
transform:scale(1.2);
}

.card::after{
content:"View Image";
position:absolute;
bottom:-40px;
left:0;
width:100%;
text-align:center;
background:rgba(0,0,0,0.7);
padding:10px;
transition:0.4s;
}

.card:hover::after{
bottom:0;
}

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:80%;
max-height:80%;
border-radius:10px;
box-shadow:0 0 40px black;
}

.close{
position:absolute;
top:25px;
right:40px;
font-size:40px;
cursor:pointer;
}

.dark{
background:#111;
}

</style>
</head>

<body>

<button class="theme-btn" onclick="toggleTheme()">Theme</button>

<header>My Image Gallery</header>

<div class="gallery">

<div class="card"><img src="https://picsum.photos/id/1015/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1016/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1018/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1020/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1024/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1025/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1035/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1039/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1041/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1043/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1050/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1057/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/106/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1069/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1074/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1084/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1080/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1081/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1082/600/400" onclick="openLightbox(this.src)"></div>
<div class="card"><img src="https://picsum.photos/id/1083/600/400" onclick="openLightbox(this.src)"></div>

</div>

<div class="lightbox" id="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<img id="lightbox-img">
</div>

<script>

function openLightbox(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
